<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · 中创新航 CALB</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #17211d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(400px, 100%);
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 40px 32px 32px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.06);
    }
    .logo {
      display: block;
      height: 32px;
      width: auto;
      margin: 0 auto 28px;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 20px;
      font-weight: 600;
      text-align: center;
    }
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #374151;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 15px;
      margin-bottom: 16px;
    }
    input:focus {
      outline: none;
      border-color: #31c89a;
      box-shadow: 0 0 0 3px rgba(49, 200, 154, 0.15);
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #31c89a, #0e7e61);
      cursor: pointer;
    }
    button:disabled { opacity: 0.7; cursor: wait; }
    .error {
      color: #dc2626;
      font-size: 13px;
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <img class="logo" src="/calb-logo.png" alt="中创新航 CALB" width="267" height="32" />
    <h1>登录</h1>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" placeholder="邮箱 / 工号" required />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit" id="submit">登录</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const csrf = '__CSRF__';
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.textContent = '';
      submit.disabled = true;
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            csrf,
          }),
        });
        if (!response.ok) {
          errorEl.textContent = response.status === 401 ? '用户名或密码错误' : '登录失败，请稍后重试';
          return;
        }
        window.location.href = '/';
      } catch {
        errorEl.textContent = '网络错误，请稍后重试';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
