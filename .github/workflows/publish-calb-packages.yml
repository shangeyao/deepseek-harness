# 发布 CALB 全套可安装包到 GitHub Packages（@shangeyao scope）。
#
# 手动发布：Actions → Publish CALB Packages → package=all → Run workflow
# 推送/PR：Validate only（构建检查，不上传）。
#
# 若 Actions 报 Billing 错误，在本地执行：
#   gh auth refresh -h github.com -s write:packages,read:packages
#   ./deploy/scripts/publish-calb-packages.sh all
name: Publish CALB Packages

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'apps/cli/package.json'
      - '.github/workflows/publish-calb-packages.yml'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, calb/ldap-deploy]
    paths:
      - 'deploy/**'
      - 'apps/cli/package.json'
      - '.github/workflows/publish-calb-packages.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      package:
        description: What to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - dsh-client-ui-account
          - calb-ldap-gateway
          - dsh

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-calb-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  CALB_PUBLISH_VERSION: '0.1.1'
  DSH_TELEMETRY_DISABLED: '1'
  NPM_CONFIG_REGISTRY: https://npm.pkg.github.com

jobs:
  validate:
    name: Validate CALB publish build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build Harness (dsh CLI)
        run: pnpm run build

      - name: Build account plugin
        run: pnpm --filter @shangeyao/dsh-client-ui-account run bundle

      - name: Build LDAP gateway
        run: pnpm --filter @shangeyao/calb-ldap-gateway run build

      - name: Stage dsh tarball (dry-run)
        run: node deploy/scripts/prepare-calb-dsh-publish.mjs

  publish:
    name: Publish to GitHub Packages
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          registry-url: https://npm.pkg.github.com
          scope: '@shangeyao'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build Harness (dsh CLI)
        run: pnpm run build

      - name: Build account plugin
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'dsh-client-ui-account' || github.event.inputs.package == 'dsh'
        run: pnpm --filter @shangeyao/dsh-client-ui-account run bundle

      - name: Publish @shangeyao/dsh-client-ui-account
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'dsh-client-ui-account'
        working-directory: deploy/client-ui-account
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build LDAP gateway
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'calb-ldap-gateway'
        run: pnpm --filter @shangeyao/calb-ldap-gateway run build

      - name: Publish @shangeyao/calb-ldap-gateway
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'calb-ldap-gateway'
        working-directory: deploy/ldap-gateway
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage @shangeyao/dsh tarball
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'dsh'
        id: dsh_tarball
        run: echo "path=$(node deploy/scripts/prepare-calb-dsh-publish.mjs)" >> "$GITHUB_OUTPUT"
        env:
          CALB_PUBLISH_VERSION: ${{ env.CALB_PUBLISH_VERSION }}

      - name: Publish @shangeyao/dsh
        if: github.event.inputs.package == 'all' || github.event.inputs.package == 'dsh'
        run: npm publish "${{ steps.dsh_tarball.outputs.path }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Published CALB packages @${{ env.CALB_PUBLISH_VERSION }} to GitHub Packages"
          echo "Install: npm install -g @shangeyao/dsh @shangeyao/calb-ldap-gateway"
          echo "Docs: deploy/INSTALL.zh.md"
